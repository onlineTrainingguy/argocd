apiVersion: apps/v1
kind: Deployment
metadata:
  name: guestbook-ui1
spec:
  replicas: 3
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: guestbook-ui1
  template:
    metadata:
      labels:
        app: guestbook-ui
    spec:
      containers:
        - image: nginx
          name: nginx-container
          ports:
            - containerPort: 80
